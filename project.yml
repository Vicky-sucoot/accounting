name: PocketLedger
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PocketLedger:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 多幣記帳
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 拍攝收據照片並附加到交易紀錄。
        NSFaceIDUsageDescription: 使用 Face ID 解鎖記帳資料。
        NSPhotoLibraryUsageDescription: 從相簿選取收據照片並附加到交易紀錄。
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketledger
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  PocketLedgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PocketLedger
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pocketledger.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PocketLedger.app/PocketLedger
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  PocketLedger:
    build:
      targets:
        PocketLedger: all
        PocketLedgerTests: [test]
    test:
      targets:
        - PocketLedgerTests
