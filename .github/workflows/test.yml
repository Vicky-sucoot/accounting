name: 測試

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  web-app:
    name: 網頁版：計算邏輯與瀏覽器操作測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安裝測試工具
        run: npm ci
      - name: 安裝 Chromium
        run: npx playwright install --with-deps chromium
      - name: 執行測試
        run: npm test
