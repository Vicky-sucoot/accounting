<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>實機測試清單</title>
<meta name="theme-color" content="#117a88">
<style>
/* 版面：單欄清單，每項有「正常／有問題」兩個按鈕；配色與 App 相同 */
:root {
  --bg: #f2f4f5; --surface: #ffffff; --surface2: #e9edef; --fg: #142026; --muted: #61717a; --line: #dde3e6;
  --accent: #117a88; --accent-soft: #dff0f2; --on-accent: #ffffff; --good: #23824a; --bad: #c8342c;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0b1114; --surface: #172126; --surface2: #222e34; --fg: #e6edf0; --muted: #93a3ab; --line: #2a373d;
    --accent: #45bccb; --accent-soft: #143a40; --on-accent: #06272c; --good: #5fd08a; --bad: #ff7b72; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.55; }
main { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 120px) max(16px, env(safe-area-inset-left, 0px)); }
h1 { font-size: 28px; margin: 4px 0 6px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
.lede a { color: var(--accent); }
.progress { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; display: grid; gap: 8px; }
.progress .nums { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--good); } .bar .ng { background: var(--bad); }
h2 { font-size: 13px; color: var(--muted); letter-spacing: .05em; margin: 22px 4px 6px; font-weight: 600; }
.group { background: var(--surface); border-radius: 14px; overflow: hidden; }
.item { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.item:last-child { border-bottom: 0; }
.item .t { display: flex; gap: 10px; }
.item .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 22px; padding-top: 2px; }
.item .how { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.btns { display: flex; gap: 8px; padding-left: 32px; }
.btns button { flex: 1; border: 0; border-radius: 10px; padding: 9px 8px; font: inherit; font-size: 14px; font-weight: 600; background: var(--surface2); color: var(--fg); cursor: pointer; }
.btns button:focus-visible, .actions button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.item.ok .b-ok { background: var(--good); color: #fff; }
.item.ng .b-ng { background: var(--bad); color: #fff; }
.item textarea { margin-left: 32px; width: calc(100% - 32px); min-height: 60px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; background: var(--bg); color: var(--fg); resize: vertical; }
.actions { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.actions .in { max-width: 608px; margin: 0 auto; display: flex; gap: 10px; }
.actions button { border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 700; cursor: pointer; }
.actions .copy { flex: 1; background: var(--accent); color: var(--on-accent); }
.actions .reset { background: var(--surface2); color: var(--fg); }
#report { width: 100%; min-height: 160px; margin-top: 16px; border-radius: 12px; border: 1px solid var(--line); padding: 10px; font: 13px/1.5 ui-monospace, Menlo, monospace; background: var(--surface); color: var(--fg); }
.note { font-size: 13px; color: var(--muted); margin: 8px 4px 0; }
</style>
</head>
<body>
<main>
  <h1>實機測試清單</h1>
  <p class="lede">請用 iPhone 逐項試用<a href="app/">多幣記帳</a>，每項按「正常」或「有問題」；有問題時簡單寫下發生什麼事。結果會存在這支手機上，最後按「複製回報」貼給我即可。</p>
  <div class="progress" aria-live="polite">
    <div class="nums"><span id="p-text">已完成 0／0</span><span><span style="color:var(--good)" id="p-ok">正常 0</span>・<span style="color:var(--bad)" id="p-ng">有問題 0</span></span></div>
    <div class="bar"><i class="ok" id="p-okbar"></i><i class="ng" id="p-ngbar"></i></div>
  </div>
  <div id="list"></div>
  <p class="note">測試前建議先到 App 的「設定 → 備份與還原」匯出備份檔。第 18 項會用很小的預算觸發通知，測完請記得把預算改回來。</p>
  <textarea id="report" readonly hidden aria-label="回報內容"></textarea>
</main>
<div class="actions"><div class="in"><button class="reset" id="reset">清除</button><button class="copy" id="copy">複製回報</button></div></div>

<script>
const SECTIONS = [
  ['安裝與離線', [
    ['加入主畫面', '用 Safari 開啟 App 網址 → 分享 → 加入主畫面；主畫面出現新圖示（白色收據＋橘色硬幣）'],
    ['全螢幕開啟', '從主畫面圖示開啟，畫面是全螢幕、沒有 Safari 網址列'],
    ['離線開啟', '開啟飛航模式，完全關閉 App 後再從主畫面開啟，可以正常看到資料'],
    ['離線記帳', '飛航模式下新增一筆台幣交易；關閉飛航模式後重新開啟，資料還在']
  ]],
  ['匯率', [
    ['自動匯率', '有網路時新增 USD 交易，自動帶入匯率，並顯示資料來源與匯率日期'],
    ['離線匯率', '飛航模式下新增 JPY 交易，顯示「目前離線，暫用 … 的匯率」，可以儲存'],
    ['補查匯率', '恢復網路後回到首頁，出現「使用離線匯率」提示；按「補查匯率」後金額更新']
  ]],
  ['記帳操作', [
    ['金額千分位', '輸入 12800 時顯示 12,800；跳出的是數字鍵盤'],
    ['精簡表單', '「更多選項」可以展開與收合；畫面下方的「儲存」按鈕好按'],
    ['左緣返回', '在子頁面（例如交易明細）從螢幕最左邊往右滑，可以回到上一頁'],
    ['左滑刪除與復原', '交易往左滑出現紅色「刪除」；刪除後 6 秒內按「復原」可以還原'],
    ['紀錄月曆', '「紀錄」月曆點日期會列出當天交易；在月曆上左右滑動可以切換月份']
  ]],
  ['收據照片', [
    ['拍照', '新增交易 → 更多選項 →「拍攝或選擇照片」→ 拍照，照片附加到交易'],
    ['相簿與檢視', '也能從相簿選照片；在交易明細點照片可以放大檢視']
  ]],
  ['App 鎖定', [
    ['密碼鎖', '設定 → App 鎖定 → App 密碼；切到其他 App 再回來，會要求輸入密碼'],
    ['Face ID', '改成 Face ID；回到 App 時可以用 Face ID 解鎖（失敗時可輸入密碼）']
  ]],
  ['通知與提醒', [
    ['允許通知', '設定 → 預算週期與提醒 → 允許通知，系統跳出權限詢問並允許'],
    ['預算通知', '把每月總預算暫時設為 100，新增一筆 200 元支出，收到「已超出預算」通知（測完請改回）']
  ]],
  ['固定收支', [
    ['自動補記', '設定 → 固定收支 → 新增，開始月份選上個月，儲存後自動記下上個月與本月（若入帳日已過）']
  ]],
  ['備份與匯出', [
    ['匯出備份', '設定 → 備份與還原 → 匯出備份檔，可以選「儲存到檔案」'],
    ['還原備份', '從剛才的備份檔還原，交易筆數與收據照片都正確'],
    ['CSV', '報表 → 匯出，用 Numbers 或 Excel 開啟，中文沒有亂碼']
  ]],
  ['外觀', [
    ['深色模式', '切換 iPhone 深色模式，App 各頁文字都清楚'],
    ['版面', '各頁沒有文字被切掉、按鈕重疊或需要左右捲動的情況']
  ]]
];
const KEY = 'pl.checklist';
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 私密瀏覽時無法保存 */ } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const items = [];
const list = document.getElementById('list');
let n = 0;
list.innerHTML = SECTIONS.map(([name, rows]) => '<h2>' + esc(name) + '</h2><div class="group">' + rows.map(([title, how]) => {
  n++; items.push({ id: 'i' + n, n, title, section: name });
  return '<div class="item" id="i' + n + '"><div class="t"><span class="n">' + n + '</span><div><b>' + esc(title) + '</b><div class="how">' + esc(how) + '</div></div></div>' +
    '<div class="btns"><button class="b-ok" data-v="ok">正常</button><button class="b-ng" data-v="ng">有問題</button></div>' +
    '<textarea placeholder="發生什麼事？（選填）" hidden aria-label="第 ' + n + ' 項的問題說明"></textarea></div>';
}).join('') + '</div>').join('');

function paint() {
  let ok = 0, ng = 0;
  for (const it of items) {
    const el = document.getElementById(it.id), s = state[it.id] || {};
    el.classList.toggle('ok', s.v === 'ok');
    el.classList.toggle('ng', s.v === 'ng');
    const ta = el.querySelector('textarea');
    ta.hidden = s.v !== 'ng';
    if (document.activeElement !== ta) ta.value = s.note || '';
    if (s.v === 'ok') ok++; if (s.v === 'ng') ng++;
  }
  document.getElementById('p-text').textContent = '已完成 ' + (ok + ng) + '／' + items.length;
  document.getElementById('p-ok').textContent = '正常 ' + ok;
  document.getElementById('p-ng').textContent = '有問題 ' + ng;
  document.getElementById('p-okbar').style.width = (ok / items.length * 100) + '%';
  document.getElementById('p-ngbar').style.width = (ng / items.length * 100) + '%';
}
list.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-v]'); if (!b) return;
  const id = b.closest('.item').id;
  const s = state[id] || (state[id] = {});
  s.v = s.v === b.dataset.v ? null : b.dataset.v;
  save(); paint();
  if (s.v === 'ng') document.querySelector('#' + id + ' textarea').focus();
});
list.addEventListener('input', ev => {
  if (ev.target.tagName !== 'TEXTAREA') return;
  const id = ev.target.closest('.item').id;
  (state[id] || (state[id] = {})).note = ev.target.value; save();
});
function reportText() {
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const lines = ['多幣記帳 實機測試結果', '裝置：' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''), '從主畫面開啟清單：' + (standalone ? '是' : '否'), ''];
  for (const it of items) {
    const s = state[it.id] || {};
    const mark = s.v === 'ok' ? '✅' : s.v === 'ng' ? '❌' : '⬜';
    lines.push(mark + ' ' + it.n + '. ' + it.section + '／' + it.title + (s.v === 'ng' && s.note ? '：' + s.note.trim() : ''));
  }
  return lines.join('\n');
}
document.getElementById('copy').onclick = async () => {
  const text = reportText();
  const ta = document.getElementById('report');
  ta.value = text; ta.hidden = false;
  const btn = document.getElementById('copy');
  try { await navigator.clipboard.writeText(text); btn.textContent = '已複製，貼給 Claude 即可'; }
  catch (e) { ta.focus(); ta.select(); btn.textContent = '請長按下方文字複製'; }
  setTimeout(() => { btn.textContent = '複製回報'; }, 3000);
};
document.getElementById('reset').onclick = () => {
  const btn = document.getElementById('reset');
  if (btn.dataset.armed) { state = {}; save(); paint(); document.getElementById('report').hidden = true; btn.textContent = '清除'; delete btn.dataset.armed; return; }
  btn.dataset.armed = '1'; btn.textContent = '再按一次確認';
  setTimeout(() => { btn.textContent = '清除'; delete btn.dataset.armed; }, 3000);
};
paint();
</script>
</body>
</html>
