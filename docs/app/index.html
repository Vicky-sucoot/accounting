<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>多幣記帳</title>
<meta name="description" content="個人多幣別記帳：交易日匯率換算、刷卡手續費、每月預算提醒，資料只存在本機，可離線使用。">
<meta name="theme-color" content="#117a88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="多幣記帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="主要分頁">
    <button data-tab="home" class="on"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M4.5 10.2 12 4l7.5 6.2V19a1.5 1.5 0 0 1-1.5 1.5h-3.5V15h-5v5.5H6A1.5 1.5 0 0 1 4.5 19z"/></svg>總覽</button>
    <button data-tab="list"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect class="fl" x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path class="dt" d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg>紀錄</button>
    <button data-tab="reports"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M11 4.1A8 8 0 1 0 19.9 13H11z"/><path class="fl" d="M14 3.2A7.5 7.5 0 0 1 20.8 10H14z"/></svg>報表</button>
    <button data-tab="budget"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle class="fl" cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle class="dot" cx="12" cy="12" r="1.4"/></svg>預算</button>
    <button data-tab="settings"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M10.3 3.5h3.4l.5 2.3 1.7.9 2.2-.8 1.7 2.9-1.7 1.6v1.9l1.7 1.6-1.7 2.9-2.2-.8-1.7.9-.5 2.3h-3.4l-.5-2.3-1.7-.9-2.2.8-1.7-2.9 1.7-1.6v-1.9L3.9 8.8l1.7-2.9 2.2.8 1.7-.9z"/><circle cx="12" cy="12" r="2.8"/></svg>設定</button>
  </nav>
</div>
<div id="pages" hidden></div>
<div id="lock" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript>請開啟 JavaScript 才能使用多幣記帳。</noscript>
<script src="logic.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
